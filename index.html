<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สร้างร้านกับหมวย - ระบบ POS ร้านค้าอัจฉริยะ</title>
    <!-- Automatic trailing slash redirect for GitHub Pages project sites -->
    <script>
      if (window.location.pathname === '/Pos_-_-' || window.location.pathname.endsWith('/Pos_-_-')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>
    <!-- Web App Icons (PWA & Home Screen Icons) -->
    <link rel="icon" type="image/jpeg" href="/src/assets/images/app_logo_1784468034081.jpg" />
    <link rel="apple-touch-icon" href="/src/assets/images/app_logo_1784468034081.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="สร้างร้านกับหมวย" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #1e293b; border-top-color: #ea580c; border-radius: 50%; animation: kp-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-weight: 800; font-size: 17px; letter-spacing: -0.02em; margin-bottom: 6px;">ร้านครัวกะเพรา POS</div>
        <div style="color: #64748b; font-size: 13px;">กำลังโหลดระบบ...</div>
      </div>
      <style>
        @keyframes kp-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.indexOf('กำลังโหลดระบบ') !== -1) {
          root.innerHTML = '<div style="min-height:100vh;background:#020617;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;">' +
            '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
            '<div style="font-size:18px;font-weight:bold;margin-bottom:8px;">เกิดข้อผิดพลาดในการโหลดระบบ</div>' +
            '<div style="color:#94a3b8;font-size:12px;max-width:320px;margin-bottom:20px;word-break:break-all;">' + (e.message || 'ไม่สามารถโหลดไฟล์ระบบได้') + '</div>' +
            '<button onclick="localStorage.clear();location.reload();" style="background:#ea580c;color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;">ล้างแคชและเริ่มใหม่</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
